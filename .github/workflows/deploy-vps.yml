name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Permite ejecutarlo manualmente

env:
  DOTNET_VERSION: '10.0.x'
  # Asegúrate de que este secreto sea /var/www/backend en GitHub
  APP_PATH: ${{ secrets.VPS_APP_PATH }} 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restaurar dependencias
        run: dotnet restore

      - name: 🏗️ Compilar
        run: dotnet build --configuration Release --no-restore

      - name: 📰 Publicar aplicación
        run: |
          dotnet publish ./PedidosBarrio/PedidosBarrio.Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-restore \
            --self-contained true \
            --runtime linux-x64

      - name: 📤 Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📥 Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ./publish

      - name: DEBUG LOCAL: Verificar archivos antes de enviar
        run: |
          echo "📂 Contenido de la carpeta publish local:"
          ls -la ./publish/
          find ./publish -type f | wc -l

      - name: 🔐 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 📁 Preparar directorios en VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          mkdir -p ${{ secrets.VPS_APP_PATH }}/latest
          mkdir -p ${{ secrets.VPS_APP_PATH }}/backup
          mkdir -p ${{ secrets.VPS_APP_PATH }}/logs
          # Limpiamos latest para que no haya archivos viejos
          rm -rf ${{ secrets.VPS_APP_PATH }}/latest/*
          EOF

      - name: 📤 Transferir archivos (SCP)
        run: |
          # Usamos ./publish/. para copiar el contenido sin crear la carpeta 'publish'
          scp -i ~/.ssh/deploy_key \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -r ./publish/. ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.VPS_APP_PATH }}/latest/

      - name: 🔍 DEBUG REMOTO: ¿Qué llegó a la VPS?
        run: |
          echo "🔎 Verificando archivos en la VPS tras el SCP:"
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "ls -R ${{ secrets.VPS_APP_PATH }}/latest"

      - name: 📜 Transferir script de deploy
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ./.github/scripts/deploy.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.VPS_APP_PATH }}/

      - name: 🚀 Ejecutar script de deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          chmod +x ${{ secrets.VPS_APP_PATH }}/deploy.sh
          # Ejecutamos con sudo si el servicio requiere permisos de root
          sudo ${{ secrets.VPS_APP_PATH }}/deploy.sh
          EOF

      - name: ✅ Verificar estado del servicio
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          sleep 5
          if systemctl is-active --quiet pedidosbarrio; then
            echo "✅ Servicio activo y funcionando."
          else
            echo "❌ ERROR: El servicio no inició correctamente."
            journalctl -u pedidosbarrio -n 50 --no-pager
            exit 1
          fi
          EOF

      - name: 📊 Notificar Éxito
        if: success()
        run: echo "🚀 El deploy de PedidosBarrio Backend terminó con éxito."

      - name: 🚨 Notificar Fallo
        if: failure()
        run: |
          echo "❌ El deploy falló. Revisa el paso 'DEBUG REMOTO' o los logs de systemd arriba."
          exit 1
